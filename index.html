<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قدو بلي - PS4</title>
    <style>
        body { 
            background-color: #0b0f19; 
            color: #ffffff; 
            font-family: Tahoma, sans-serif; 
            text-align: center; 
            padding: 20px; 
            margin: 0;
        }
        .container { 
            max-width: 500px; 
            margin: 40px auto; 
            background: #131b2e; 
            padding: 25px; 
            border-radius: 15px; 
            border: 2px solid #00a2ff; 
            box-shadow: 0 0 20px rgba(0, 162, 255, 0.4); 
        }
        img.logo { 
            width: 200px; 
            height: auto; 
            border-radius: 10px; 
            margin-bottom: 15px; 
            box-shadow: 0 0 10px rgba(0, 162, 255, 0.5); 
        }
        h1 { 
            color: #00a2ff; 
            margin-bottom: 10px; 
        }
        p {
            color: #b0c4de;
        }
        .phone { 
            font-size: 22px; 
            background: #1c2640; 
            padding: 10px 15px; 
            display: inline-block; 
            border-radius: 8px; 
            margin: 15px 0; 
            border: 1px dashed #00a2ff; 
            color: #00ffcc; 
            direction: ltr; 
            font-weight: bold; 
        }
        .btn-jailbreak {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #00b0ff, #0077ff);
            color: white;
            text-decoration: none;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(0, 162, 255, 0.4);
            transition: 0.2s;
            box-sizing: border-box;
        }
        .btn-jailbreak:hover {
            background: linear-gradient(135deg, #0090cc, #005bb5);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- شعارك الخاص -->
        <img src="9131A947-2C98-4AF0-B8AA-8F50A3E922A1.png" alt="قدو بلي" class="logo">
        <h1> قدو بلي</h1>
        <p>أهلاً بكم في صفحتنا الخاصة لتعديل الألعاب</p>
        
        <div>
            <div class="phone">07736513664</div>
        </div>

        <!-- زر عدل الآن الذي يحول الزبون للموقع المطلوب -->
        <a href="https://gamerhack.github.io/g2all/index.html" class="btn-jailbreak">عدل الآن</a>
    </div>
</body>
</html>
